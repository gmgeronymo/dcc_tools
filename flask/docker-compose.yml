services:
  dccgenerator:
    image: dccgenerator
    restart: always
    volumes:
    - ./app:/app
    ports:
    - 9099:80
    environment:
      # Valores lidos do arquivo ./flask/.env (nao versionado).
      # Veja .env.example para gerar e configurar.
      DCC_SECRET_KEY: ${DCC_SECRET_KEY:-}
      DCC_DB_PATH: ${DCC_DB_PATH:-}
      DCC_SESSION_HOURS: ${DCC_SESSION_HOURS:-8}
      DCC_ALLOWED_SCHEMA_HOSTS: ${DCC_ALLOWED_SCHEMA_HOSTS:-ptb.de,w3.org}
      DCC_MAX_SCHEMA_BYTES: ${DCC_MAX_SCHEMA_BYTES:-5242880}
      DCC_EMAIL_ENABLED: ${DCC_EMAIL_ENABLED:-true}
      SMTP_HOST: ${SMTP_HOST:-smtp.exemplo.org}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_USE_AUTH: ${SMTP_USE_AUTH:-false}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-false}
      SMTP_FROM: ${SMTP_FROM:-no-reply@exemplo.org}
      SMTP_TIMEOUT: ${SMTP_TIMEOUT:-15}
      APP_BASE_URL: ${APP_BASE_URL:-}
      DCC_RESET_TOKEN_MINUTES: ${DCC_RESET_TOKEN_MINUTES:-60}
