{% extends "base.html" %}

{% block title %}Validar XML DCC{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 760px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-2">Validar DCC com o schema XSD</h1>
            <p class="text-muted">Envie um arquivo XML para validar conformidade com o padrão DCC.</p>

            <form action="{{ url_for('validate_xml') }}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Arquivo XML</label>
                    <input type="file" class="form-control" name="xml_file" accept=".xml" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Validar XML</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
