{% extends "base.html" %}

{% block title %}Gerar DCC via Excel{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 760px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-2">Gerar DCC a partir de planilha Excel</h1>
            <p class="text-muted">Envie a planilha preenchida para converter em JSON e gerar o XML do DCC.</p>

            <div class="d-flex flex-wrap gap-2 mb-4">
                <a href="{{ url_for('static', filename='examples/dcc_excel.xlsx') }}" class="btn btn-outline-primary btn-sm" download>Baixar planilha modelo</a>
                <a href="{{ url_for('excel_guide') }}" class="btn btn-outline-secondary btn-sm">Guia de preenchimento</a>
                <a href="{{ url_for('form_dcc') }}" class="btn btn-outline-info btn-sm">Usar formulário interativo</a>
            </div>

            <form action="{{ url_for('upload_xls') }}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="xls_file">Arquivo Excel (.xlsx)</label>
                    <input type="file" class="form-control" name="xls_file" accept=".xlsx" required>
                </div>
                <button type="submit" class="btn btn-success w-100">Gerar DCC (XML)</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
