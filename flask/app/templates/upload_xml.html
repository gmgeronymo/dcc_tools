{% extends "base.html" %}

{% block title %}Embutir DCC no PDF{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 760px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-2">Incluir DCC no PDF do Certificado</h1>
            <p class="text-muted">Envie o PDF do certificado e o XML DCC para gerar um PDF com anexo XML.</p>

            <form action="{{ url_for('pdf_attach') }}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Arquivo XML</label>
                    <input type="file" class="form-control" name="xml_file" accept=".xml" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Arquivo PDF</label>
                    <input type="file" class="form-control" name="pdf_file" accept=".pdf" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Gerar PDF com DCC anexado</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
