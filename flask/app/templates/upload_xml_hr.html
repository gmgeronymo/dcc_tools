{% extends "base.html" %}

{% block title %}Visualizar DCC{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 760px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-2">Visualizar DCC (Human Readable)</h1>
            <p class="text-muted">Envie um XML DCC para gerar a visualização em HTML.</p>

            <form action="{{ url_for('visualizar_dcc') }}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Arquivo XML</label>
                    <input type="file" class="form-control" name="xml_file" accept=".xml" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Visualizar DCC</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
