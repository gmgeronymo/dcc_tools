{% extends "base.html" %}

{% block title %}DCC Tools - Recuperar senha{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h1 class="h4 mb-3">Recuperar senha</h1>
                    <p class="text-muted">
                        Informe o e-mail institucional cadastrado. Enviaremos um link para você
                        definir uma nova senha.
                    </p>

                    {% if message %}
                    <div class="alert alert-info" role="alert">{{ message }}</div>
                    {% endif %}

                    <form method="post" action="{{ url_for('esqueci_senha') }}">
                        <div class="mb-3">
                            <label for="email" class="form-label">E-mail</label>
                            <input type="email" class="form-control" id="email" name="email"
                                   placeholder="usuario@inmetro.gov.br" autocomplete="email" required>
                        </div>
                        <button type="submit" class="btn btn-primary">Enviar link</button>
                        <a href="{{ url_for('login') }}" class="link-secondary ms-2">Voltar ao login</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
