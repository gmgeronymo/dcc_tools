{% extends "base.html" %}

{% block title %}Gerar DCC via JSON{% endblock %}

{% block content %}
<div class="container py-5" style="max-width: 760px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <h1 class="h3 mb-2">Gerar DCC a partir de arquivo JSON</h1>
            <p class="text-muted">Envie um arquivo JSON no formato da API para gerar o XML do DCC.</p>

            <div class="d-flex flex-wrap gap-2 mb-4">
                <a href="{{ url_for('static', filename='examples/dcc_json.json') }}" class="btn btn-outline-primary btn-sm" download target="_blank">Baixar exemplo JSON</a>
                <a href="{{ url_for('api_doc') }}" class="btn btn-outline-secondary btn-sm">Abrir documentação da API</a>
                <a href="{{ url_for('form_dcc') }}" class="btn btn-outline-info btn-sm">Usar formulário interativo</a>
            </div>

            <form action="{{ url_for('upload_json') }}" method="post" enctype="multipart/form-data">
                <div class="mb-3">
                    <label class="form-label fw-semibold" for="json_file">Arquivo JSON</label>
                    <input type="file" class="form-control" name="json_file" accept=".json" required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Gerar DCC (XML)</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
